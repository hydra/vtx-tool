[package]
name = "rf-cal"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = "4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "=0.36.1"
egui = "=0.36.1"
egui_dock = "=0.21.1"
egui_plot = "=0.37.0"
egui_table = "0.10.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
